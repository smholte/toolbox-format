name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Samples, checker and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Samples are up to date (tools/make_samples.py makes the same bytes)
        run: python tools/make_samples.py --check
      - name: The samples and the type list pass the checker
        run: python check.py samples/Toolbox types.json
      - name: Tests (the checker on the samples and on broken copies)
        run: python -m pytest -q tests
